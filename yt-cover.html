<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>표지 영상</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  #p, iframe { width:100%; height:100%; border:0; display:block; }
</style>
</head>
<body>
<div id="p"></div>
<script>
// 뽀모도로 표지에서 유튜브 영상을 틀어 주는 작은 페이지.
// 앱 안의 파일(file://)에서 바로 유튜브를 넣으면 "어디서 틀었는지"가 없어 유튜브가 막기 때문에(오류 153),
// 앱이 이 컴퓨터 안(127.0.0.1)에서만 여는 작은 주소로 이 페이지를 띄우고 그 안에서 유튜브를 넣는다.
const q = new URLSearchParams(location.search);
const ok = s => /^[\w-]+$/.test(s);
const v = q.get('v'), list = q.get('list');
const send = m => parent.postMessage(m, '*');
let player = null, ready = false, want = null;
function apply(cmd) {
  if (!ready) { want = cmd; return; }
  if (cmd === 'play') player.playVideo(); else if (cmd === 'pause') player.pauseVideo();
}
window.onYouTubeIframeAPIReady = () => {
  if (!(v && ok(v)) && !(list && ok(list))) { send({ type: 'error', code: 2 }); return; }
  const vars = { playsinline: 1, rel: 0, loop: 1 };
  if (list && ok(list)) { vars.listType = 'playlist'; vars.list = list; } else vars.playlist = v;   // 한 곡이면 계속 반복
  player = new YT.Player('p', {
    videoId: v && ok(v) ? v : undefined,
    playerVars: vars,
    events: {
      onReady() { ready = true; send({ type: 'ready' }); if (want) apply(want); },
      onError(e) { send({ type: 'error', code: e.data }); },
      onStateChange(e) { send({ type: 'state', state: e.data }); },
    },
  });
};
window.addEventListener('message', e => {
  if (e.source !== parent) return;
  const d = e.data;
  if (d && typeof d.cmd === 'string') apply(d.cmd);
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
