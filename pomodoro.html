<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>뽀모도로</title>
<style>
  :root { --play: rgba(232,128,122,.85); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:transparent; font-family:'Malgun Gothic','Segoe UI',sans-serif; color:#fff; user-select:none; overflow:hidden; }
  #card { position:absolute; inset:4px; border-radius:20px; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,.45); }
  /* ── 배경 (옛날 MP3 "Now Playing" 같은 흐릿한 색 번짐) ── */
  #bg, #bgImg, #glow { position:absolute; inset:-30px; }
  #bgImg { background-size:cover; background-position:center; display:none; }
  #glow { background:
      radial-gradient(40% 35% at 18% 30%, rgba(255,255,255,.35), transparent 70%),
      radial-gradient(35% 30% at 85% 20%, rgba(255,255,255,.22), transparent 70%),
      radial-gradient(45% 40% at 70% 85%, rgba(255,255,255,.15), transparent 70%);
    filter:blur(18px); }
  #shade { position:absolute; inset:0; background:rgba(0,0,0,.12); }
  #ui { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; padding:0 22px 14px; text-shadow:0 1px 3px rgba(0,0,0,.25); }

  /* 위쪽 띠: 끌어서 창 이동 */
  .bar { width:calc(100% + 44px); height:48px; display:flex; align-items:center; padding:0 12px; -webkit-app-region:drag; flex:none; }
  .bar .t { flex:1; text-align:center; font-size:15px; font-weight:600; letter-spacing:.3px; }
  button { -webkit-app-region:no-drag; font-family:inherit; cursor:pointer; border:0; color:#fff; background:transparent; padding:0; }
  .ib { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; opacity:.9; }
  .ib:hover { background:rgba(255,255,255,.18); opacity:1; }
  .ib.on { background:rgba(255,255,255,.25); }
  .ib svg { width:20px; height:20px; }

  /* 레코드판 */
  .disc { width:150px; height:150px; margin-top:6px; flex:none; position:relative; }
  .disc svg { width:100%; height:100%; overflow:visible; }
  .disc .spin { transform-origin:50% 50%; animation:spin 6s linear infinite; animation-play-state:paused; }
  body.running .disc .spin { animation-play-state:running; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .disc .arm { transform-origin:84px 50px; transition:transform .6s ease; transform:rotate(-18deg); }
  body.running .disc .arm { transform:rotate(0deg); }
  /* 사진을 넣으면 레코드판 대신 둥근 사각형 표지 (재생 중엔 살짝 커짐) */
  #art { display:none; width:100%; height:100%; object-fit:cover; border-radius:18px; box-shadow:0 8px 22px rgba(0,0,0,.35);
         transform:scale(.92); transition:transform .5s ease; -webkit-user-drag:none; }
  body.running #art { transform:scale(1); }
  body.hasArt .disc svg { display:none; }
  body.hasArt #art { display:block; }
  body.hasArt .disc { width:168px; height:168px; }
  /* 유튜브 주소를 넣으면 표지 자리에서 그 영상이 재생된다 (16:9 둥근 사각형) */
  #vid { display:none; position:absolute; inset:0; border-radius:16px; overflow:hidden; background:#000; box-shadow:0 8px 22px rgba(0,0,0,.35); }
  #vid iframe, #vid video { width:100%; height:100%; border:0; display:block; }
  #vid video { object-fit:cover; background:#000; }
  body.hasVid .disc { width:298px; height:168px; }
  body.hasVid .disc svg, body.hasVid #art { display:none; }
  body.hasVid #vid { display:block; }
  #vidErr { display:none; position:absolute; inset:0; background:rgba(0,0,0,.82); flex-direction:column; align-items:center; justify-content:center;
            gap:10px; padding:14px; text-align:center; font-size:13px; line-height:1.45; }
  #vidErr.on { display:flex; }
  #vidErr button { height:32px; padding:0 14px; border-radius:10px; background:#FF0033; font-size:13px; font-weight:700; }
  .yrow { display:flex; gap:6px; }
  .yrow input { flex:1; min-width:0; height:34px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); border-radius:10px; color:#fff;
                font-family:inherit; font-size:12px; padding:0 10px; outline:none; }
  .yrow input:focus { border-color:rgba(255,255,255,.5); }
  .yrow input::placeholder { color:rgba(255,255,255,.5); }
  .yrow .sbtn { flex:none; height:34px; }

  .title { margin-top:16px; font-size:24px; font-weight:400; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub { font-size:14px; opacity:.6; margin-top:2px; }
  .modes { display:flex; gap:6px; margin-top:12px; }
  .modes button { font-size:12px; padding:4px 10px; border-radius:12px; background:rgba(255,255,255,.14); opacity:.8; }
  .modes button.on { background:rgba(255,255,255,.85); color:#5a4a6a; opacity:1; text-shadow:none; font-weight:700; }

  /* 진행 막대: 왼쪽 = 지난 시간, 오른쪽 = 남은 시간 */
  .prog { width:100%; display:flex; align-items:center; gap:10px; margin-top:18px; font-size:12px; font-variant-numeric:tabular-nums; }
  .prog span { width:40px; opacity:.85; }
  .prog span:last-child { text-align:right; }
  .track { flex:1; height:6px; border-radius:3px; background:rgba(255,255,255,.35); position:relative; }
  .fill { position:absolute; left:0; top:0; bottom:0; border-radius:3px; background:#fff; width:0; transition:width .25s linear; }
  .knob { position:absolute; top:-5px; width:3px; height:16px; background:#fff; border-radius:2px; transform:translateX(-1px); transition:left .25s linear; }
  .remain { margin-top:8px; font-size:13px; opacity:.9; }

  #task { margin-top:10px; width:100%; background:rgba(255,255,255,.16); border:0; border-radius:18px; color:#fff; font-size:13px; padding:7px 14px;
          outline:none; font-family:inherit; text-align:center; text-shadow:none; }
  #task::placeholder { color:rgba(255,255,255,.65); }

  .ctrl { display:flex; gap:22px; align-items:center; margin-top:14px; }
  .round { width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,.28); display:flex; align-items:center; justify-content:center; }
  .round:hover { background:rgba(255,255,255,.4); }
  .round svg { width:22px; height:22px; }
  #start { width:72px; height:72px; background:var(--play); box-shadow:0 4px 14px rgba(0,0,0,.15); }
  #start:hover { filter:brightness(1.08); }
  #start svg { width:30px; height:30px; }

  .foot { margin-top:auto; width:100%; display:flex; align-items:center; justify-content:space-between; font-size:12px; opacity:.85; }
  .dots { display:flex; gap:5px; }
  .dots i { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.35); }
  .dots i.done { background:#fff; }

  /* ≡ 설정 */
  #setup { display:none; position:absolute; inset:48px 12px 12px; background:rgba(30,26,40,.9); backdrop-filter:blur(8px); border-radius:16px;
           padding:14px 8px 14px 14px; flex-direction:column; font-size:13px; text-shadow:none; }
  /* 내용은 위에서 스크롤, 확인 버튼은 아래에 항상 보이게 */
  .sbody { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:9px; padding-right:8px; }
  /* 둥근 모서리 사각형 스크롤 막대 */
  .sbody > *, .reset-box > * { flex:none; }
  #setup .sbody > .sbtn, #setup .reset-box > .sbtn { flex:none; height:38px; }
  .sbody::-webkit-scrollbar { width:8px; }
  .sbody::-webkit-scrollbar-track { background:rgba(255,255,255,.06); border-radius:6px; }
  .sbody::-webkit-scrollbar-thumb { background:rgba(255,255,255,.32); border-radius:6px; }
  .sbody::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.5); }
  /* 기록 초기화 */
  .reset-box { display:flex; flex-direction:column; gap:8px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:10px; }
  .seg { display:grid; grid-template-columns:repeat(3, 1fr); gap:5px; }
  .seg button { height:30px; border-radius:9px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); font-size:12px; }
  .seg button.on { background:rgba(255,255,255,.85); color:#3a3046; font-weight:700; }
  .range { display:none; align-items:center; gap:6px; }
  .range.on { display:flex; }
  .range input { flex:1; min-width:0; height:30px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.14); border-radius:9px; color:#fff;
                 font-family:inherit; font-size:12px; padding:0 6px; color-scheme:dark; }
  .rcount { font-size:12px; opacity:.75; }
  .snd button { display:flex; align-items:center; justify-content:center; gap:4px; }
  .snd button::before { content:'♪'; opacity:.7; }
  .danger { background:rgba(232,87,79,.22) !important; border-color:rgba(232,87,79,.55) !important; color:#FFD9D6; }
  .danger:hover { background:rgba(232,87,79,.38) !important; }
  #setup.open { display:flex; }
  #setup h4 { margin:2px 0 0; font-size:13px; opacity:.7; font-weight:600; }
  #setup label { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  #setup input[type=number] { width:70px; height:30px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.14); border-radius:10px; color:#fff;
                              padding:0 6px; font-size:14px; font-weight:600; font-family:inherit; text-align:center; outline:none; -moz-appearance:textfield; }
  #setup input[type=number]:focus { border-color:rgba(255,255,255,.5); background:rgba(255,255,255,.16); }
  #setup input[type=number]::-webkit-inner-spin-button, #setup input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
  /* 켜기/끄기 스위치 */
  .sw { appearance:none; -webkit-appearance:none; width:38px; height:22px; border-radius:11px; background:rgba(255,255,255,.2); position:relative; cursor:pointer; flex:none; transition:background .2s; margin:0; }
  .sw::after { content:''; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .sw:checked { background:var(--play); }
  .sw:checked::after { transform:translateX(16px); }
  #setup input[type=range] { flex:1; }
  .presets { display:flex; flex-wrap:wrap; gap:8px; }
  .presets div { width:34px; height:34px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .presets div.on { border-color:#fff; }
  .row2 { display:flex; gap:6px; align-items:center; }
  .row2 input[type=color] { width:36px; height:30px; border:1px solid rgba(255,255,255,.2); border-radius:10px; padding:2px; background:rgba(255,255,255,.08); cursor:pointer; }
  .row2 input[type=color]::-webkit-color-swatch-wrapper { padding:0; }
  .row2 input[type=color]::-webkit-color-swatch { border:0; border-radius:7px; }
  /* 둥근 모서리 사각형 버튼 */
  .sbtn { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; height:36px; background:rgba(255,255,255,.1);
          border:1px solid rgba(255,255,255,.16); border-radius:12px; padding:0 10px; font-size:13px; font-weight:600; transition:background .15s, border-color .15s; }
  .sbtn:hover { background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.3); }
  .sbtn svg { width:16px; height:16px; flex:none; }
  #sDone { flex:none; margin:12px 6px 0 0; height:48px; background:var(--play); border-radius:14px; font-weight:700; font-size:16px; letter-spacing:1px;
           box-shadow:0 4px 14px rgba(0,0,0,.25); transition:filter .15s; }
  #sDone:hover { filter:brightness(1.08); }
  .note { font-size:11px; opacity:.6; }
</style>
</head>
<body>
<div id="card">
  <div id="bg"></div><div id="bgImg"></div><div id="glow"></div><div id="shade"></div>
  <div id="ui">
    <div class="bar">
      <button class="ib" id="top" title="항상 위에 두기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.8V5h6v5.8l2.5 3.2h-11z"/></svg></button>
      <div class="t" id="head">Now Focusing</div>
      <button class="ib" id="setBtn" title="설정 (시간·배경)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="ib" id="close" title="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <!-- 레코드판: 타이머가 돌면 같이 돈다 -->
    <div class="disc">
      <svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
        <g class="spin">
          <circle cx="50" cy="50" r="46"/>
          <circle cx="50" cy="50" r="10"/>
          <path d="M50 22a28 28 0 0 0-28 28"/>
          <path d="M50 31a19 19 0 0 0-19 19"/>
        </g>
        <g class="arm"><path d="M84 50v24"/><rect x="80.5" y="54" width="7" height="12" rx="3" fill="none"/><path d="M84 74v8"/></g>
      </svg>
      <img id="art" alt="">
      <div id="vid"><div id="vidErr"><div id="vidErrMsg"></div><button type="button" id="vidOpen">유튜브 창에서 열기</button></div></div>
    </div>

    <div class="title" id="title">집중</div>
    <div class="sub" id="sub">Pomodoro</div>
    <div class="modes" id="modes">
      <button data-m="focus">집중</button>
      <button data-m="short">짧은 휴식</button>
      <button data-m="long">긴 휴식</button>
      <button data-m="free" title="시간을 정하지 않고 0부터 재기 (끝내기를 누르면 기록)">⏱ 자유</button>
    </div>

    <div class="prog"><span id="elapsed">00:00</span><div class="track"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div><span id="remain">-25:00</span></div>
    <div class="remain" id="remainText">25분 00초 남았어요</div>

    <input id="task" placeholder="무엇에 집중하나요? (선택)" maxlength="60">

    <div class="ctrl">
      <button class="round" id="reset" title="처음부터"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M18 5L8 12l10 7z"/><path d="M6 5v14" stroke-linecap="round"/></svg></button>
      <button class="round" id="start" title="시작"></button>
      <button class="round" id="skip" title="다음으로 넘기기"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M6 5l10 7-10 7z"/><path d="M18 5v14" stroke-linecap="round"/></svg></button>
    </div>

    <div class="foot"><span id="today"></span><div class="dots" id="dots"></div></div>
  </div>

  <div id="setup"><div class="sbody">
    <h4>시간</h4>
    <label>집중 (분) <input type="number" id="sFocus" min="1" max="180"></label>
    <label>짧은 휴식 (분) <input type="number" id="sShort" min="1" max="60"></label>
    <label>긴 휴식 (분) <input type="number" id="sLong" min="1" max="120"></label>
    <label>긴 휴식은 집중 몇 번마다 <input type="number" id="sEvery" min="2" max="10"></label>
    <label>끝나면 다음 것 자동 시작 <input type="checkbox" class="sw" id="sAuto"></label>
    <label>끝날 때 소리 <input type="checkbox" class="sw" id="sSound"></label>
    <div class="seg snd" id="sndList"></div>
    <label>소리 크기 <input type="range" id="sVol" min="0" max="100"></label>
    <h4>배경</h4>
    <div class="presets" id="presets"></div>
    <div class="row2">직접 고르기 <input type="color" id="c1"> <input type="color" id="c2"></div>
    <h4>표지</h4>
    <div class="row2"><button class="sbtn" id="pickImg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>사진 추가</button><button class="sbtn" id="clearImg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>레코드판</button><input type="file" id="file" accept="image/*" hidden></div>
    <div class="yrow"><input id="ytUrl" placeholder="유튜브 주소 붙여넣기" spellcheck="false"><button class="sbtn" id="ytSet" type="button">영상 넣기</button></div>
    <button class="sbtn" id="pickVid" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="13" height="14" rx="3"/><path d="M16 10l5-3v10l-5-3z"/></svg>동영상 파일 넣기</button>
    <div class="note" id="vidName"></div>
    <label>타이머와 함께 재생·멈춤 <input type="checkbox" class="sw" id="ytSync"></label>
    <label>배경 흐리게 <input type="range" id="blur" min="0" max="30"></label>
    <div class="note">사진을 넣으면 가운데 레코드판이 그 사진(둥근 사각형)으로 바뀌고, 배경에도 흐리게 깔려요. 5MB 이하 사진만 쓸 수 있어요.<br>유튜브 주소를 넣거나 컴퓨터의 동영상 파일(mp4 권장)을 고르면 표지 자리에서 그 영상이 나와요. 레코드판을 누르면 원래대로 돌아가요.</div>
    <h4>초기화</h4>
    <div class="reset-box">
      <div class="seg" id="rPeriod">
        <button type="button" data-p="today" class="on">오늘</button>
        <button type="button" data-p="week">이번 주</button>
        <button type="button" data-p="month">이번 달</button>
        <button type="button" data-p="custom">기간 선택</button>
        <button type="button" data-p="all">전체</button>
      </div>
      <div class="range" id="rRange"><input type="date" id="rFrom"> ~ <input type="date" id="rTo"></div>
      <div class="rcount" id="rCount"></div>
      <button type="button" class="sbtn danger" id="rLog">🍅 이 기간 기록 지우기</button>
    </div>
    <button type="button" class="sbtn" id="rCfg">시간·배경 설정을 처음 상태로</button>
    </div>
    <button id="sDone">확인</button>
  </div>
</div>
<script src="common.js"></script>
<script>
const LABEL = { focus: '집중', short: '짧은 휴식', long: '긴 휴식', free: '자유' };
const HEAD = { focus: 'Now Focusing', short: 'Short Break', long: 'Long Break', free: 'Free Focus' };
const PLAYCOLOR = { focus: 'rgba(232,128,122,.88)', short: 'rgba(92,184,140,.88)', long: 'rgba(96,150,220,.88)', free: 'rgba(150,112,206,.88)' };
const PLAY = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M8 4.5v15L20 12z"/></svg>';
// 자유 모드의 '끝내기' 버튼 (네모)과 원래의 '다음으로' 버튼
const STOP = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>';
const SKIP = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M6 5l10 7-10 7z"/><path d="M18 5v14" stroke-linecap="round"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="6.5" y="5" width="3.5" height="14" rx="1"/><rect x="14" y="5" width="3.5" height="14" rx="1"/></svg>';
const key = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

// ── 배경 ──
const PRESETS = {
  sunday:   ['#D4575F', '#B9A3C4', '#5D5FA0'],   // 예시 그림 같은 분홍·보라
  peach:    ['#F6B38E', '#F7D9A8', '#E58C8A'],
  ocean:    ['#2E6F95', '#5FA8C9', '#3C3B7A'],
  forest:   ['#3E7D68', '#9BC59D', '#2A4A5C'],
  lavender: ['#9B8BD6', '#E8C3E6', '#6E7BC9'],

    [784, 988, 1175, 988, 1319, 1175, 1568].forEach((f, i) => tone(ac, out, t + i * .16, f, .45, 'sine', .9, [1, 4, 9.2]));
    [784, 988, 1175, 1568].forEach((f, i) => tone(ac, out, t + 1.5 + i * .16, f, .5, 'sine', .9, [1, 4, 9.2]));
  } else {                                         // 삐삐삐삐- 디지털 시계 알람 (세 번)
    for (const r of [0, 1, 2]) for (let k = 0; k < 4; k++) tone(ac, out, t + r + k * .13, 2093, .1, 'square', 1.2);
  }
}
const SOUND_LEN = { dingdong: 3.2, bell: 5.2, chime: 3.4, xylo: 2.3, alarm: 2.6 };
function playSound(name = cfg.soundName, vol = cfg.volume) {
  try {
    const ac = ensureAudio();
    const out = ac.createGain(); out.gain.value = Math.max(0, Math.min(1, vol / 100)) * 0.7; out.connect(ac.destination);
    const go = () => renderSound(ac, out, name, ac.currentTime + 0.05);
    ac.state === 'running' ? go() : ac.resume().then(go).catch(go);
  } catch {}
}
// 처음 누르는 순간 오디오 장치를 깨워 둔다
document.addEventListener('pointerdown', () => ensureAudio(), { once: true });

$('start').onclick = () => running() ? pause() : start();
$('reset').onclick = () => {
  if (isFree() && freeElapsed() >= 1 && !confirm('기록하지 않고 0으로 되돌릴까요?')) return;
  setMode(mode);
};
$('skip').onclick = () => isFree() ? finishFree() : finish(false);
$('task').oninput = draw;
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => {
  if (b.dataset.m === mode) return;
  if ((running() || (isFree() && freeElapsed() >= 1)) && !confirm(isFree() ? '자유 모드에서 잰 시간은 기록되지 않아요. 바꿀까요? (기록하려면 ■ 끝내기)' : '타이머가 돌아가는 중이에요. 바꿀까요?')) return;
  setMode(b.dataset.m);
});

// ≡ 설정
const fields = { sFocus: 'focus', sShort: 'short', sLong: 'long', sEvery: 'every' };
$('setBtn').onclick = () => {
  for (const id in fields) $(id).value = cfg[fields[id]];
  $('sAuto').checked = cfg.auto; $('sSound').checked = cfg.sound;
  $('sVol').value = cfg.volume; drawSounds();
  showReset();
  $('setup').classList.toggle('open'); $('setBtn').classList.toggle('on', $('setup').classList.contains('open'));
};
// 소리 고르기: 누르면 바로 들려준다
function drawSounds() {
  $('sndList').innerHTML = '';
  Object.entries(SOUNDS).forEach(([k, name]) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = name; b.title = '눌러서 미리 듣기';
    b.classList.toggle('on', k === cfg.soundName);
    b.onclick = () => { cfg.soundName = k; save('pomoCfg', cfg); drawSounds(); playSound(k, +$('sVol').value); };
    $('sndList').append(b);
  });
}
$('sVol').onchange = e => { cfg.volume = +e.target.value; save('pomoCfg', cfg); playSound(cfg.soundName, cfg.volume); };

// ── 초기화 (기간을 골라 뽀모도로 기록 지우기) ──
let rPeriod = 'today';
function periodRange() {
  const now = new Date(), t = key(now);
  if (rPeriod === 'today') return [t, t];
  if (rPeriod === 'week') {   // 월요일 ~ 일요일
    const d = new Date(now); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    const e = new Date(d); e.setDate(d.getDate() + 6); return [key(d), key(e)];
  }
  if (rPeriod === 'month') return [key(new Date(now.getFullYear(), now.getMonth(), 1)), key(new Date(now.getFullYear(), now.getMonth() + 1, 0))];
  if (rPeriod === 'custom') { let a = $('rFrom').value, b = $('rTo').value || a; if (!a) return null; if (b < a) [a, b] = [b, a]; return [a, b]; }
  return ['0000-00-00', '9999-12-31'];
}
const inPeriod = r => { const p = periodRange(); return p && r.date >= p[0] && r.date <= p[1]; };
function showReset() {
  document.querySelectorAll('#rPeriod button').forEach(b => b.classList.toggle('on', b.dataset.p === rPeriod));
  $('rRange').classList.toggle('on', rPeriod === 'custom');
  const list = live(load('pomoLog', [])).filter(inPeriod);
  const p = periodRange();
  $('rCount').textContent = !p ? '시작 날짜를 골라 주세요.'
    : (rPeriod === 'all' ? '전체 기록' : p[0] === p[1] ? p[0] : `${p[0]} ~ ${p[1]}`) + ` · 🍅 ${list.length}회 (${list.reduce((a, r) => a + r.minutes, 0)}분)`;
  $('rLog').disabled = !list.length; $('rLog').style.opacity = list.length ? 1 : .45;
}
document.querySelectorAll('#rPeriod button').forEach(b => b.onclick = () => {
  rPeriod = b.dataset.p;
  if (rPeriod === 'custom' && !$('rFrom').value) { $('rFrom').value = $('rTo').value = key(new Date()); }
  showReset();
});
$('rFrom').onchange = $('rTo').onchange = showReset;
$('rLog').onclick = async () => {
  const targets = live(load('pomoLog', [])).filter(inPeriod);
  if (!targets.length) return;
  if (!(await askBackupBefore(`${$('rCount').textContent}\n이 기록을 지워요.`))) return;
  const log = load('pomoLog', []);
  const ids = new Set(targets.map(r => r.id));
  log.forEach(r => { if (ids.has(r.id)) { r.deleted = true; touch(r); } });
  save('pomoLog', log);
  showReset(); draw();
};
$('rCfg').onclick = async () => {
  if (!(await askBackupBefore('집중·휴식 시간, 자동 시작, 소리, 배경과 표지(사진·영상)를 처음 상태로 되돌려요. (기록은 그대로)'))) return;
  localStorage.removeItem('pomoCfg'); localStorage.removeItem('pomoBg'); localStorage.removeItem('pomoCycle');
  location.reload();
};

$('sDone').onclick = () => {
  for (const id in fields) { const v = Math.round(+$(id).value); if (v >= +$(id).min && v <= +$(id).max) cfg[fields[id]] = v; }
  cfg.auto = $('sAuto').checked; cfg.sound = $('sSound').checked; cfg.volume = +$('sVol').value;
  save('pomoCfg', cfg);
  $('setup').classList.remove('open'); $('setBtn').classList.remove('on');
  if (!isFree() && !running() && left === total) setMode(mode); else draw();
};

$('top').onclick = () => window.api.pomoAction('top');
$('close').onclick = () => {
  if (running() && !confirm('타이머가 돌아가는 중이에요. 끌까요?')) return;
  window.api.pomoAction('close');
};
window.api.onPomo(s => { if ('onTop' in s) $('top').classList.toggle('on', !!s.onTop); });
// 달력에서 기록을 지우면 오늘 횟수도 맞춘다
window.addEventListener('storage', e => { if (e.key === 'pomoLog') draw(); });

applyBg();
setMode('focus');
</script>
</body>
</html>
