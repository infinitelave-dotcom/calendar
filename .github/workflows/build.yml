name: Build Windows exe
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-calendar-windows
          path: |
            dist/DesktopCalendar.exe
            dist/DesktopCalendar.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 바탕화면 캘린더 (최신 버전)
          body: |
            추천 - DesktopCalendar.zip 을 내려받아 압축을 풀고, 폴더 안의 "바탕화면 캘린더.exe" 를 더블클릭하세요.
            DesktopCalendar.exe 는 파일 하나로 실행되지만 윈도우 보안 검사에 오래 걸릴 수 있습니다.
          make_latest: true
          files: |
            dist/DesktopCalendar.exe
            dist/DesktopCalendar.zip
