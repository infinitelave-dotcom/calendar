name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # 새 버전(package.json 의 version)이면 GitHub Releases 에 v버전 으로 올린다.
      # 설치된 앱은 여기에 올라온 latest.yml 을 보고 업데이트 여부를 판단한다.
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check native module is packaged
        shell: bash
        run: npx --yes @electron/asar list dist/win-unpacked/resources/app.asar | grep -q koffi || ls dist/win-unpacked/resources/app.asar.unpacked/node_modules/koffi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-calendar-setup
          path: dist/*.exe
