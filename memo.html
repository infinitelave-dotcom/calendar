<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>메모</title>
<style>
  :root { --paper: #FFE88A; --ink: #3A3220; --shadow: rgba(0,0,0,.35); --ts: none; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:transparent; font-family:'Malgun Gothic','Segoe UI',sans-serif; user-select:none; }
  #note { position:absolute; inset:6px 6px 0 6px; display:flex; flex-direction:column; }
  #paper { flex:1; min-height:0; display:flex; flex-direction:column; background:var(--paper); color:var(--ink);
           border-radius:4px 4px 12px 0; box-shadow:0 4px 14px var(--shadow); overflow:hidden; text-shadow:var(--ts); }
  /* 위쪽 띠: 끌어서 창 이동 */
  .bar { display:flex; align-items:center; gap:6px; padding:6px 8px; background:rgba(0,0,0,.07); -webkit-app-region:drag; flex:none; }
  body.locked .bar { -webkit-app-region:no-drag; }
  .bar .title { flex:1; font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.75; }
  .dot { width:16px; height:16px; border-radius:50%; cursor:pointer; border:1.5px solid rgba(0,0,0,.25); -webkit-app-region:no-drag; flex:none; }
  .dot.on { border:2px solid var(--ink); }
  .bar button { -webkit-app-region:no-drag; background:transparent; border:0; color:var(--ink); font-size:15px; cursor:pointer; padding:0 4px; opacity:.6; }
  .bar button:hover { opacity:1; }
  .bar button svg { width:16px; height:16px; display:block; }
  .bar button.on { opacity:1; background:rgba(0,0,0,.15); border-radius:5px; }
  /* 투명도 조절 줄 */
  .opbar { display:none; align-items:center; gap:8px; padding:4px 10px; font-size:12px; background:rgba(0,0,0,.05); flex:none; }
  .opbar.open { display:flex; }
  .opbar input { flex:1; }
  .opbar span { width:34px; text-align:right; }
  #text { flex:1; min-height:0; overflow-y:auto; outline:none; color:var(--ink); padding:10px 14px 14px; font-size:16px; line-height:1.55;
          user-select:text; word-break:break-word; position:relative; }
  #text:empty::before { content:attr(data-ph); opacity:.45; pointer-events:none; }
  /* 메모 속 표 */
  #text table { border-collapse:collapse; width:100%; margin:6px 0; table-layout:fixed; }
  #text td { border:1px solid color-mix(in srgb, var(--ink) 40%, transparent); padding:3px 6px; vertical-align:top; min-width:30px; font-size:15px; }
  #text tr:first-child td { font-weight:700; background:rgba(0,0,0,.06); }
  /* 체크리스트: 글머리 자리에 네모 상자를 그리고, 누르면 체크 */
  #text ul.chk { list-style:none; padding-left:0; margin:4px 0; }
  #text ul.chk li { position:relative; padding-left:26px; min-height:1.55em; }
  #text ul.chk li::before { content:''; position:absolute; left:2px; top:.22em; width:15px; height:15px; border-radius:4px;
                            border:2px solid color-mix(in srgb, var(--ink) 65%, transparent); cursor:pointer; box-sizing:border-box; }
  #text ul.chk li[data-done="1"]::before { background:color-mix(in srgb, var(--ink) 75%, transparent); border-color:transparent; }
  #text ul.chk li[data-done="1"]::after { content:''; position:absolute; left:7px; top:.36em; width:5px; height:9px;
                            border:solid var(--chk); border-width:0 2.5px 2.5px 0; transform:rotate(45deg); pointer-events:none; }
  #text ul.chk li[data-done="1"] { text-decoration:line-through; opacity:.55; }
  #text td.cur { box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--ink) 55%, transparent); }
  /* 표 편집 도구 (표 안에 있을 때만 보임) */
  #ttools { display:none; position:absolute; z-index:3; gap:2px; background:#2B2F36; border-radius:8px; padding:3px; box-shadow:0 4px 12px rgba(0,0,0,.35); }
  #ttools.show { display:flex; }
  #ttools button { background:transparent; border:0; color:#F6F4EE; font-size:12px; padding:4px 7px; border-radius:5px; cursor:pointer; font-family:inherit; white-space:nowrap; text-shadow:none; }
  #ttools button:hover { background:rgba(255,255,255,.15); }
  #ttools button.danger { color:#FF9B8A; }
  /* 아래쪽 시트 탭 (엑셀처럼) */
  .sheets { display:flex; align-items:flex-start; gap:2px; overflow-x:auto; flex:none; height:34px; scrollbar-width:none; }
  .sheets::-webkit-scrollbar { display:none; }
  .sheet { min-width:34px; height:26px; padding:0 12px; border-radius:0 0 8px 8px; color:var(--ink); background:rgba(255,255,255,.55);
           font-size:13px; line-height:26px; cursor:pointer; white-space:nowrap; flex:none; box-shadow:0 2px 4px var(--shadow); opacity:.8; text-shadow:var(--ts); }
  .sheet.on { opacity:1; height:30px; line-height:30px; font-weight:700; box-shadow:0 3px 6px rgba(0,0,0,.3); }
  .sheet input.edit { width:90px; border:0; background:rgba(255,255,255,.8); color:var(--ink); font-size:13px; font-family:inherit; border-radius:4px; padding:2px 4px; }
  .add { flex:none; height:26px; padding:0 10px; border:0; border-radius:0 0 8px 8px; background:rgba(255,255,255,.4); color:#333;
         font-size:16px; cursor:pointer; box-shadow:0 2px 4px rgba(0,0,0,.2); }
  .add:hover { background:rgba(255,255,255,.7); }
</style>
</head>
<body>
<div id="note">
  <div id="paper">
    <div class="bar">
      <div class="title" id="title"></div>
      <button id="colorBtn" title="메모 색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.9 1.4-1.9-.5-1.1.3-2.1 1.5-2.1H17a4 4 0 0 0 4-4c0-5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1.3" fill="currentColor"/><circle cx="10.5" cy="7" r="1.3" fill="currentColor"/><circle cx="15" cy="7.5" r="1.3" fill="currentColor"/></svg></button>
      <button id="chkBtn" title="체크리스트 넣기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="7" rx="1.5"/><path d="M4.8 7.6l1.5 1.5 2.4-3"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M13 7.5h8M13 17.5h8"/></svg></button>
      <button id="tableBtn" title="표 넣기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></svg></button>
      <button id="opBtn" title="메모 투명도"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
      <button id="lockBtn" title="메모 위치·크기 잠금 (달력 잠금과 별도)"></button>
      <button id="hide" title="메모 창 숨기기 (달력 위 [메모] 버튼으로 다시 열기)">✕</button>
    </div>
    <div class="opbar" id="colorbar">종이 색 <div id="dots" style="display:flex;gap:6px"></div></div>
    <div class="opbar" id="opbar">투명도 <input type="range" id="opacity" min="15" max="100"><span id="opVal"></span></div>
    <div id="text" contenteditable="true" spellcheck="false" data-ph="여기에 메모를 적으세요"></div>
  </div>
  <div class="sheets" id="sheets"></div>
</div>
<div id="ttools">
  <button data-t="rowAdd" title="아래에 줄 추가">+ 줄</button>
  <button data-t="colAdd" title="오른쪽에 칸 추가">+ 칸</button>
  <button data-t="rowDel" title="이 줄 삭제">− 줄</button>
  <button data-t="colDel" title="이 칸 삭제">− 칸</button>
  <button data-t="tableDel" class="danger" title="표 삭제">표 삭제</button>
</div>
<script src="common.js"></script>
<script>
const ed = $('text');
const MEMO_COLORS = ['#FFE88A','#FFC1CC','#BDE8C0','#B9DDF7','#E1CFFF','#FFD3A8','#F4F1EA'];

// 메모: [{id, title, html, text, color, u, deleted}]  (html = 표가 들어갈 수 있는 내용, text = 글자만)
const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let memos = load('memos', null) || [touch({ id: uid(), title: '', html: '', text: '', color: MEMO_COLORS[0] })];
memos.forEach(m => { if (m.html === undefined) m.html = esc(m.text || '').replace(/\n/g, '<br>'); });
let active = load('activeMemo', null);
const saveMemos = () => { save('memos', memos); save('activeMemo', active); };
const liveMemos = () => live(memos);
function cur() {
  let m = liveMemos().find(x => x.id === active);
  if (!m) {
    m = liveMemos()[0];
    if (!m) { m = touch({ id: uid(), title: '', html: '', text: '', color: MEMO_COLORS[0] }); memos.push(m); save('memos', memos); }
    active = m.id; save('activeMemo', active);
  }
  return m;
}

// 메모 투명도 (달력과 따로). 많이 비칠 때는 글자를 흰색+그림자로 바꿔 어두운 배경에서도 보이게 한다.
let memoCfg = Object.assign({ opacity: 100 }, load('memoCfg', {}));
const paperOf = c => `rgba(${hexRgb(c).join(',')},${memoCfg.opacity / 100})`;
function applyOpacity() {
  const a = memoCfg.opacity / 100, s = document.documentElement.style;
  const see = a < 0.6;
  s.setProperty('--ink', see ? '#FFFFFF' : '#3A3220');
  s.setProperty('--chk', see ? '#3A3220' : 'var(--paper-solid, #FFE88A)');   // 체크 표시는 상자 색과 반대로
  s.setProperty('--ts', see ? '0 0 3px rgba(0,0,0,.95), 0 1px 2px rgba(0,0,0,.9)' : 'none');
  s.setProperty('--shadow', `rgba(0,0,0,${(0.35 * a).toFixed(2)})`);
  $('opacity').value = memoCfg.opacity; $('opVal').textContent = memoCfg.opacity + '%';
}
$('opBtn').onclick = () => { $('opbar').classList.toggle('open'); $('opBtn').classList.toggle('on'); };
$('colorBtn').onclick = () => { $('colorbar').classList.toggle('open'); $('colorBtn').classList.toggle('on'); };
$('opacity').oninput = e => { memoCfg.opacity = +e.target.value; save('memoCfg', memoCfg); applyOpacity(); render(); };

// 메모 잠금 (달력 잠금과 별도)
const LOCK_ON  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const LOCK_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>';
let locked = false;
function showLock() {
  $('lockBtn').innerHTML = locked ? LOCK_ON : LOCK_OFF;
  $('lockBtn').classList.toggle('on', locked);
  $('lockBtn').title = locked ? '메모 잠김 - 눌러서 풀기' : '메모 위치·크기 잠금 (달력 잠금과 별도)';
  document.body.classList.toggle('locked', locked);
}
$('lockBtn').onclick = () => { locked = !locked; showLock(); window.api.setMemoLocked(locked); };

function render() {
  const m = cur();
  document.documentElement.style.setProperty('--paper', paperOf(m.color));
  if (ed.dataset.id !== m.id || cleanHtml() !== m.html) { ed.innerHTML = m.html; ed.dataset.id = m.id; hideTools(); }
  $('title').textContent = m.title;
  document.documentElement.style.setProperty('--paper-solid', m.color);
  updateCount();
  // 종이 색
  const dots = $('dots'); dots.innerHTML = '';
  MEMO_COLORS.forEach(c => {
    const d = document.createElement('div');
    d.className = 'dot' + (c === m.color ? ' on' : ''); d.style.background = c; d.title = '메모 색';
    d.onclick = () => { m.color = c; touch(m); saveMemos(); render(); };
    dots.append(d);
  });
  // 시트 탭
  const bar = $('sheets'); bar.innerHTML = '';
  liveMemos().forEach(memo => {
    const tab = document.createElement('div');
    tab.className = 'sheet' + (memo.id === m.id ? ' on' : '');
    tab.style.background = paperOf(memo.color);
    tab.textContent = memo.title;            // 제목이 없으면 빈 탭
    tab.title = '더블클릭: 제목 넣기 · 오른쪽 클릭: 삭제';
    tab.onclick = () => { if (active !== memo.id) { active = memo.id; saveMemos(); render(); } };
    tab.ondblclick = () => inlineEdit(tab, memo.title, { maxLength: 30, placeholder: '제목',
      onDone: v => { if (v !== null && v !== memo.title) { memo.title = v; touch(memo); saveMemos(); } render(); } });
    tab.oncontextmenu = e => { e.preventDefault(); remove(memo); };
    bar.append(tab);
  });
  const add = document.createElement('button');
  add.className = 'add'; add.textContent = '+'; add.title = '새 메모';
  add.onclick = () => {
    const memo = touch({ id: uid(), title: '', html: '', text: '', color: MEMO_COLORS[liveMemos().length % MEMO_COLORS.length] });
    memos.push(memo); active = memo.id; saveMemos(); render(); ed.focus();
  };
  bar.append(add);
}

function remove(memo) {
  if (liveMemos().length === 1) {
    if (confirm('메모 내용을 모두 지울까요?')) { memo.html = ''; memo.text = ''; memo.title = ''; touch(memo); saveMemos(); render(); }
    return;
  }
  if (!confirm(`${memo.title ? `"${memo.title}"` : '이'} 메모를 삭제할까요?`)) return;
  const list = liveMemos(), i = list.indexOf(memo);
  memo.deleted = true; memo.html = ''; memo.text = ''; touch(memo);
  if (active === memo.id) active = (list[i - 1] || list[i + 1]).id;
  saveMemos(); render();
}

// ── 메모 내용 편집 ──
const cleanHtml = () => ed.innerHTML.replace(/ class="cur"/g, '');   // 커서 칸 표시는 저장하지 않는다
function saveText() {
  const m = cur();
  // 다 지웠을 때 남는 빈 줄바꿈은 비워서 안내 문구가 다시 보이게
  if (ed.innerText.trim() === '' && !ed.querySelector('table, ul.chk')) ed.innerHTML = '';
  m.html = cleanHtml(); m.text = ed.innerText; touch(m); saveMemos();
}
ed.addEventListener('input', saveText);
// 붙여넣기·끌어넣기는 글자만 (다른 곳의 서식이나 위험한 내용이 섞이지 않게)
ed.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain')); });
ed.addEventListener('drop', e => { e.preventDefault(); const t = e.dataTransfer.getData('text/plain'); if (t) document.execCommand('insertText', false, t); });

// ── 표 ──
function caretInEditor() {
  const sel = getSelection();
  return sel.rangeCount && ed.contains(sel.getRangeAt(0).startContainer);
}
function insertTable(rows = 3, cols = 3) {
  ed.focus();
  if (!caretInEditor()) {               // 커서가 없으면 맨 끝에 넣는다
    const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false);
    getSelection().removeAllRanges(); getSelection().addRange(r);
  }
  const row = '<tr>' + '<td><br></td>'.repeat(cols) + '</tr>';
  document.execCommand('insertHTML', false, `<table><tbody>${row.repeat(rows)}</tbody></table><div><br></div>`);
  const tables = ed.querySelectorAll('table');
  // 방금 넣은 표의 첫 칸으로 커서 이동
  const sel = getSelection(); const anchor = sel.anchorNode;
  let t = [...tables].reverse().find(tb => tb.compareDocumentPosition(anchor) & Node.DOCUMENT_POSITION_FOLLOWING) || tables[tables.length - 1];
  if (t) placeCaret(t.rows[0].cells[0]);
  saveText();
}
function placeCaret(cell) {
  const r = document.createRange(); r.selectNodeContents(cell); r.collapse(true);
  getSelection().removeAllRanges(); getSelection().addRange(r);
}
const curCell = () => {
  const sel = getSelection(); if (!sel.rangeCount) return null;
  let n = sel.anchorNode; if (n && n.nodeType === 3) n = n.parentNode;
  const td = n && n.closest && n.closest('td');
  return td && ed.contains(td) ? td : null;
};
const tools = $('ttools');
function hideTools() { tools.classList.remove('show'); ed.querySelectorAll('td.cur').forEach(c => c.classList.remove('cur')); }
function showTools() {
  const td = curCell();
  ed.querySelectorAll('td.cur').forEach(c => c !== td && c.classList.remove('cur'));
  if (!td) { tools.classList.remove('show'); return; }
  td.classList.add('cur');
  const tb = td.closest('table').getBoundingClientRect();
  tools.classList.add('show');
  const top = Math.max(2, tb.top - tools.offsetHeight - 4);
  tools.style.top = (top < 40 ? tb.bottom + 4 : top) + 'px';
  tools.style.left = Math.max(4, Math.min(tb.left, innerWidth - tools.offsetWidth - 4)) + 'px';
}
document.addEventListener('selectionchange', () => { if (document.activeElement === ed) showTools(); });
ed.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== ed) hideTools(); }, 150));
ed.addEventListener('scroll', () => tools.classList.contains('show') && showTools());
// 도구 버튼을 눌러도 커서가 표에서 빠지지 않도록
tools.addEventListener('mousedown', e => e.preventDefault());
tools.addEventListener('click', e => {
  const b = e.target.closest('button'); const td = curCell(); if (!b || !td) return;
  const tr = td.parentNode, table = tr.closest('table'), ci = td.cellIndex;
  const blank = () => { const c = document.createElement('td'); c.innerHTML = '<br>'; return c; };
  switch (b.dataset.t) {
    case 'rowAdd': { const nr = document.createElement('tr'); [...tr.cells].forEach(() => nr.append(blank())); tr.after(nr); placeCaret(nr.cells[ci]); break; }
    case 'colAdd': [...table.rows].forEach(r => r.cells[ci].after(blank())); placeCaret(tr.cells[ci + 1]); break;
    case 'rowDel':
      if (table.rows.length === 1) { table.remove(); hideTools(); break; }
      { const next = tr.nextElementSibling || tr.previousElementSibling; tr.remove(); placeCaret(next.cells[Math.min(ci, next.cells.length - 1)]); }
      break;
    case 'colDel':
      if (tr.cells.length === 1) { table.remove(); hideTools(); break; }
      [...table.rows].forEach(r => r.cells[ci].remove()); placeCaret(tr.cells[Math.min(ci, tr.cells.length - 1)]);
      break;
    case 'tableDel': if (confirm('표를 삭제할까요?')) { table.remove(); hideTools(); } break;
  }
  saveText(); showTools();
});
// 표 안에서 Tab = 다음 칸, Shift+Tab = 이전 칸, 마지막 칸에서 Tab = 줄 추가
ed.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const td = curCell(); if (!td) return;
  e.preventDefault();
  const cells = [...td.closest('table').querySelectorAll('td')], i = cells.indexOf(td);
  if (e.shiftKey) { if (i > 0) placeCaret(cells[i - 1]); return; }
  if (i < cells.length - 1) { placeCaret(cells[i + 1]); return; }
  const tr = td.parentNode, nr = document.createElement('tr');
  [...tr.cells].forEach(() => { const c = document.createElement('td'); c.innerHTML = '<br>'; nr.append(c); });
  tr.after(nr); placeCaret(nr.cells[0]); saveText();
});
$('tableBtn').onclick = () => insertTable();

// ── 체크리스트 ──
// <ul class="chk"><li data-done="1">…</li></ul> 모양. Enter = 다음 항목, 빈 항목에서 Enter = 목록 끝내기(브라우저 기본 동작)
function insertChecklist() {
  ed.focus();
  if (!caretInEditor()) {
    const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false);
    getSelection().removeAllRanges(); getSelection().addRange(r);
  }
  // 이미 체크리스트 안이면 항목 하나 더
  const li = curItem();
  if (li) { const n = document.createElement('li'); n.innerHTML = '<br>'; li.after(n); placeCaret(n); saveText(); return; }
  document.execCommand('insertHTML', false, '<ul class="chk"><li id="__newchk"><br></li></ul>');
  const n = document.getElementById('__newchk');
  if (n) { n.removeAttribute('id'); placeCaret(n); }
  saveText();
}
const curItem = () => {
  const sel = getSelection(); if (!sel.rangeCount) return null;
  let n = sel.anchorNode; if (n && n.nodeType === 3) n = n.parentNode;
  const li = n && n.closest && n.closest('ul.chk > li');
  return li && ed.contains(li) ? li : null;
};
// 네모 상자(항목 왼쪽 26px)를 누르면 체크/해제
ed.addEventListener('mousedown', e => {
  const li = e.target.closest && e.target.closest('ul.chk > li');
  if (!li || !ed.contains(li)) return;
  const x = e.clientX - li.getBoundingClientRect().left;
  if (x > 24) return;
  e.preventDefault();
  li.dataset.done = li.dataset.done === '1' ? '0' : '1';
  saveText(); updateCount();
});
// Enter 로 새 항목이 생길 때 "체크됨" 이 따라오지 않게
ed.addEventListener('beforeinput', e => {
  if (e.inputType === 'insertParagraph' && curItem()) newItemPending = true;
});
let newItemPending = false;
ed.addEventListener('input', e => {
  if (!newItemPending) return;
  newItemPending = false;
  const li = curItem();
  if (li && li.textContent === '' && li.hasAttribute('data-done')) { li.removeAttribute('data-done'); saveText(); }
});
// 제목 줄에 "체크 3/5" 처럼 진행 상황 보여 주기
function updateCount() {
  const all = ed.querySelectorAll('ul.chk > li'), done = ed.querySelectorAll('ul.chk > li[data-done="1"]');
  const m = cur();
  $('title').textContent = m.title + (all.length ? `${m.title ? ' · ' : ''}✔ ${done.length}/${all.length}` : '');
}
ed.addEventListener('input', updateCount);
$('chkBtn').onclick = insertChecklist;
$('hide').onclick = () => window.api.setMemoVisible(false);

// 다른 창에서 메모가 바뀌면 다시 그리기
window.addEventListener('storage', e => {
  if (e.key === 'memos') { memos = load('memos', []); render(); }
});

window.api.onState(s => { locked = s.memoLocked; showLock(); });
showLock(); applyOpacity(); render();
</script>
</body>
</html>
